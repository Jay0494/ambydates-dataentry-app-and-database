<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Ledger — Entry &amp; Update</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Sales Ledger</h1>
      <div class="sub">Connected to Supabase</div>
    </div>
  </header>

  <nav class="tabs">
    <a class="tab-btn active" href="index.html">Entry &amp; Update</a>
    <a class="tab-btn" href="view.html">View &amp; Search</a>
  </nav>

  <section id="pageEntry">

    <div class="card">
      <h2>Load an existing sale</h2>
      <p class="hint">Enter a Purchase ID to load it for editing, or leave blank to enter a brand new sale below.</p>
      <div class="lookup-row">
        <div class="field">
          <label for="lookupId">Purchase ID</label>
          <input type="number" id="lookupId" placeholder="e.g. 42">
        </div>
        <button class="secondary" onclick="lookupSale()">Load record</button>
        <button class="secondary" onclick="resetForm()">Clear / new entry</button>
      </div>
      <div id="lookupStatus" class="status"></div>
    </div>

    <div class="card">
      <h2 id="formTitle">New sale</h2>
      <p class="hint" id="formHint">Fill in the details and save. Fields marked in the labels are required.</p>

      <div class="grid">

        <div class="field">
          <label>Customer</label>
          <div class="row-inline">
            <select id="customerSelect"><option value="">Select customer…</option></select>
            <button type="button" class="btn-mini" onclick="toggleInline('customer')" title="Add new customer">+</button>
          </div>
          <div class="inline-add" id="customerAdd">
            <input type="text" id="newCustomerName" placeholder="New customer name">
            <button type="button" onclick="addCustomer()">Add</button>
          </div>
        </div>

        <div class="field">
          <label>Product</label>
          <div class="row-inline">
            <select id="productSelect"><option value="">Select product…</option></select>
            <button type="button" class="btn-mini" onclick="toggleInline('product')" title="Add new product">+</button>
          </div>
          <div class="inline-add" id="productAdd">
            <input type="text" id="newProductName" placeholder="New product name">
            <button type="button" onclick="addProduct()">Add</button>
          </div>
        </div>

        <div class="field">
          <label>Quantity</label>
          <input type="number" id="fQuantity" min="0" step="1">
        </div>

        <div class="field">
          <label>Purchase date</label>
          <input type="date" id="fDate">
        </div>

        <div class="field">
          <label>Cost</label>
          <input type="number" id="fCost" min="0" step="0.01">
        </div>

        <div class="field">
          <label>Shipping cost</label>
          <input type="number" id="fShipping" min="0" step="0.01">
        </div>

        <div class="field">
          <label>Revenue</label>
          <input type="number" id="fRevenue" min="0" step="0.01">
        </div>

        <div class="field">
          <label>Balance</label>
          <input type="number" id="fBalance" min="0" step="0.01">
        </div>

      </div>

      <div class="actions">
        <button class="primary" id="saveBtn" onclick="saveSale()">Save new sale</button>
        <button class="danger" id="deleteBtn" style="display:none" onclick="deleteSale()">Delete this sale</button>
        <div id="saveStatus" class="status"></div>
      </div>
    </div>

  </section>

</div>

<script src="js/supabase-client.js"></script>
<script src="js/shared.js"></script>
<script src="js/entry.js"></script>
</body>
</html>
